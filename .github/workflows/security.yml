# 資安檢查：相依套件的已知漏洞與授權、GitHub Actions 工作流程本身的安全問題。
#
# 除了 push 與 PR，每天也跑一次：程式沒有改，相依套件也可能在之後被發現漏洞。
# 發現的問題會讓這個工作流程失敗；zizmor 的結果另外顯示在 Security → Code scanning。
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天 03:17 UTC（台灣 11:17；避開整點，GitHub 在整點的排程常延遲）
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Rust 相依套件：RustSec 的已知漏洞、授權、來源（設定在 deny.toml）
  cargo-deny:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --locked

  # 前端的 npm 套件（只在建置時使用，不會進入執行檔，但建置時會執行它們的程式碼）
  npm-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: npm audit
        run: npm --prefix frontend audit --audit-level=moderate

  # PR 新增或升級的套件（包括 Dependabot 開的 PR）：有已知漏洞就不能合併。
  # 授權由上面的 cargo-deny 檢查，這裡不重複
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          license-check: false
          # 不在 PR 留言：留言需要寫入權限
          comment-summary-in-pr: never

  # GitHub Actions 工作流程：權限過大、可被注入的寫法、沒有固定版本的 action 等
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # 把結果上傳到 Security → Code scanning
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  # 已經發布的容器映像檔：基底（distroless）的套件之後被發現漏洞、而且已經有修正版時失敗，
  # 提醒發布新版本。還沒有修正版的只列出、不擋：發布新版本也修不了。
  # 只在排程與手動執行時跑：映像檔跟這次 push 的程式無關
  image-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Scan the published image
        run: |
          docker run --rm aquasec/trivy:0.76.2 image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL ghcr.io/adunding/manorcloud:latest

# 推送 v* 標籤時：編譯兩種架構，建立 GitHub Release，並發布容器映像檔。
#
# 也可以在 Actions 頁面手動執行（workflow_dispatch）：只編譯、打包、建置並測試映像檔，
# 不建立 Release、不推送映像檔，用來在正式發布前確認整個流程能跑完。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 標籤 v0.2.0 的 Release 裡必須是 0.2.0 的程式：忘記改 Cargo.toml 就推了標籤，
      # 在這裡停下，而不是發布一個名不符實的版本
      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi

      # 發布用的建置不使用快取：快取可能被其他工作流程寫入（cache poisoning），
      # 發布的檔案只能來自乾淨的下載
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # 與本機相同的 cross 版本；編譯用的映像由 Cross.toml 固定
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      # package.sh 會建置前端、交叉編譯、檢查 glibc 版本、打包
      - name: Package
        run: ./package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    # 手動試跑時不建立 Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      # 只有這個工作需要寫入權限：建立 Release
      contents: write
      # 發布檔的簽章（GitHub 的 build provenance attestation）：
      # id-token 向 GitHub 取得一次性的簽章憑證，attestations 存放簽章
      id-token: write
      attestations: write
    steps:
      # 取得 install.sh：它也要放上 Release，一行安裝從這裡下載它
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # SBOM：這個版本用到的所有套件（Rust 與前端）的清單，SPDX 格式。
      # 之後某個套件被發現漏洞時，可以直接查出哪些版本受影響
      - name: Create the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: manorcloud-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # 去掉檔名中的版本號：一行安裝用 releases/latest/download/<檔名>，檔名必須固定。
      # manorcloud-0.1.0-aarch64.tar.gz → manorcloud-linux-aarch64.tar.gz
      # 架構名稱中沒有連字號（x86_64 用的是底線），所以最後一個連字號之後就是架構
      - name: Name the assets and compute checksums
        run: |
          mkdir release
          for file in artifacts/manorcloud-*.tar.gz; do
            arch=${file##*-}
            arch=${arch%.tar.gz}
            cp "$file" "release/manorcloud-linux-$arch.tar.gz"
          done
          cp install.sh manorcloud-sbom.spdx.json release/
          ls -l release
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS

      # 簽章：證明每個檔案是這個 repo 的這個 commit 由 GitHub Actions 建置的。
      # 與 SHA256SUMS 不同，簽章由 GitHub 簽發，換掉 Release 中的檔案的人無法偽造。
      # 驗證：gh attestation verify <檔案> --repo <擁有者>/manorcloud（見 README）
      - name: Sign the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release/manorcloud-linux-*.tar.gz, release/install.sh, release/manorcloud-sbom.spdx.json"

      # 標籤中有連字號（v0.2.0-rc.1）的標記為預先發布版：
      # releases/latest 只指向正式版，一行安裝不會裝到測試版
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ManorCloud $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease

  # 容器映像檔：用 build 已經編譯好的程式，不重新編譯（見 Dockerfile）。
  # 手動試跑時只建置與測試，推標籤時才推送到 ghcr.io 並簽章
  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # 推送到 GitHub 的映像檔倉庫（ghcr.io）
      packages: write
      # 映像檔的簽章，與 Release 的檔案相同
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # 從安裝包取出程式，依 Docker 的架構名稱放好
      - name: Prepare the binaries
        run: |
          for pair in x86_64:amd64 aarch64:arm64; do
            arch=${pair%%:*}
            platform=${pair##*:}
            mkdir -p "docker/$platform"
            tar -xzf artifacts/manorcloud-*-"$arch".tar.gz -C "docker/$platform" \
              --strip-components=1 --wildcards '*/manorcloud'
          done
          # 映像檔中的 /var/lib/manorcloud 與它的兩個 volume（見 Dockerfile）
          mkdir -p docker/state/data docker/state/database
          ls -lR docker

      # 推送之前先實際啟動一次：資料夾權限之類的問題在這裡就會發現
      - name: Build and test the image
        run: |
          docker buildx create --use --name manorcloud
          docker buildx build --platform linux/amd64 --load -t manorcloud:test .
          docker run -d --name test -p 127.0.0.1:3000:3000 manorcloud:test
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          if ! curl -fsS -o /dev/null http://127.0.0.1:3000/; then
            docker logs test
            exit 1
          fi
          docker rm -f test

      # 推送之前先掃描：基底的套件有已經修正的高風險漏洞就停下來，
      # 先合併 Dependabot 更新基底的 PR 再發布。還沒有修正版的只列出、不擋
      - name: Scan the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2 image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL manorcloud:test

      # 正式版同時標上 latest；有連字號的測試版（v0.4.0-rc.1）只有版本號
      - name: Publish the image
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=${GITHUB_REF_NAME#v}
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags=(-t "$image:$version")
          case "$version" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
          docker buildx build --platform linux/amd64,linux/arm64 "${tags[@]}" \
            --push --metadata-file metadata.json .
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Sign the image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

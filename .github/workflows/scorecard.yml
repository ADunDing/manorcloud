# OpenSSF Scorecard：替這個 repo 的供應鏈安全打分數（分支保護、固定 action 版本、
# Token 權限、相依套件更新、簽章的發布檔等），結果顯示在 Security → Code scanning。
#
# 這個工作流程的寫法受 Scorecard 限制：不能有全域的 env 或 defaults，
# 只能使用它允許的 action，否則分數無法公開。
name: Scorecard

on:
  push:
    branches: [main]
  # 分支保護規則變更時重新評分
  branch_protection_rule:
  schedule:
    - cron: "29 5 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # 上傳結果到 Code scanning
      security-events: write
      # 把分數公開到 OpenSSF（README 的徽章需要）
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

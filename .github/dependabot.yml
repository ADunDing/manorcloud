# Dependabot：自動開 PR 更新相依套件。
#
# 資安修正在漏洞公告時立刻送出（在 Settings → Advanced Security → Dependabot security updates 開啟），
# 不受下面的排程限制。每月的更新讓其他套件保持最新，每一類合成一個 PR，一起檢查與測試。
version: 2
updates:
  # GitHub Actions：工作流程中的 action 都固定在 commit hash，Dependabot 會一併更新 hash 與旁邊的版本註解
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Rust 套件（Cargo.lock）
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      # RustCrypto 的套件（hmac、sha1、sha2 等）共用同一套 trait，大版本必須一起升級：
      # 分開成好幾個 PR 時，每一個單獨都無法編譯
      rustcrypto:
        patterns: ["hmac", "sha1", "sha2", "digest", "argon2", "password-hash"]
      crates:
        patterns: ["*"]
        update-types: [minor, patch]

  # 前端的建置工具（frontend/package-lock.json）
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # 容器映像檔的基底（Dockerfile 的 FROM）：glibc、CA 憑證的安全更新
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

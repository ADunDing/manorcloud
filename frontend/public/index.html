<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManorCloud</title>
  <!-- 沒有這一行，瀏覽器會自動請求 /favicon.ico 並得到 404 -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- 所有樣式與腳本都是本站的獨立檔案：CSP 禁止行內的 <style>、<script> 與 onclick 等屬性 -->
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/main.js"></script>
</head>

<body>
  <header class="topbar">
    <a id="brand" class="brand" href="#/">ManorCloud</a>
    <div id="account" class="account"></div>
  </header>
  <div class="shell">
    <!-- 左側欄：登入後才顯示 -->
    <aside id="sidebar" class="sidebar" aria-label="Navigation" hidden></aside>
    <main id="app" class="content">
      <p class="muted">Loading…</p>
    </main>
  </div>
  <!-- 右下角的面板：未完成的上傳、上傳進度 -->
  <div id="panels" class="panels" hidden></div>
  <noscript>ManorCloud needs JavaScript to work.</noscript>
</body>

</html>

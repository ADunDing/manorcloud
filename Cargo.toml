[package]
name = "manorcloud"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

# unsafe 預設禁止：只有呼叫作業系統（libc）的少數函式明確允許，並在旁邊寫明為什麼安全。
# 新增的 unsafe 一定要加上 #[allow(unsafe_code)]，在審查時一眼就看得到
[lints.rust]
unsafe_code = "deny"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
getrandom = "0.4.3"
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "signal", "sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
unicode-normalization = "0.1.25"
libc = "0.2"
futures-util = "0.3.34"
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
hmac = "0.13"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
sha1 = "0.11"
qrcode = { version = "0.15", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
futures-util = "0.3.34"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }  # 測試用：oneshot 直接呼叫 Router
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true

[profile.dev.package."*"]
opt-level = 2
